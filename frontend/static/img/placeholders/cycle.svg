<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#faf8f5"/>
  <rect x="40" y="40" width="520" height="320" rx="16" fill="#e7e5e0"/>
  <g transform="translate(200, 95)">
    <circle cx="100" cy="80" r="75" fill="#c25e3e" fill-opacity="0.15"/>
    <!-- Left wheel -->
    <circle cx="45" cy="90" r="28" fill="none" stroke="#0f172a" stroke-width="6"/>
    <circle cx="45" cy="90" r="4" fill="#0f172a"/>
    <!-- Right wheel -->
    <circle cx="155" cy="90" r="28" fill="none" stroke="#0f172a" stroke-width="6"/>
    <circle cx="155" cy="90" r="4" fill="#0f172a"/>
    <!-- Frame -->
    <polyline points="45,90 95,90 135,55 85,55 45,90" fill="none" stroke="#c25e3e" stroke-width="6" stroke-linejoin="round"/>
    <line x1="95" y1="90" x2="85" y2="55" stroke="#c25e3e" stroke-width="6"/>
    <!-- Handlebar & seat -->
    <line x1="135" y1="55" x2="155" y2="90" stroke="#c25e3e" stroke-width="6"/>
    <line x1="130" y1="45" x2="145" y2="45" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
    <line x1="75" y1="48" x2="95" y2="48" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="300" y="295" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="600" fill="#0f172a" text-anchor="middle">Cycles &amp; Campus Mobility</text>
  <text x="300" y="325" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Hostel Bicycles, Cable Locks &amp; Campus Rides</text>
</svg>
