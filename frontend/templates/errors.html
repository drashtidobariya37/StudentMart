{% extends "base.html" %}

{% block title %}{{ code }} - {{ title }} | Student Mart{% endblock %}

{% block content %}
<div class="container container-narrow" style="padding: 80px 20px; text-align: center;">
  <div style="width: 80px; height: 80px; border-radius: var(--radius-full); background-color: var(--accent-teal-soft); color: var(--accent-teal-dark); display: flex; align-items: center; justify-content: center; font-size: 2.2rem; margin: 0 auto 24px;">
    {% if code == 404 %}
      <i class="bi bi-search"></i>
    {% elif code == 403 %}
      <i class="bi bi-shield-lock-fill"></i>
    {% else %}
      <i class="bi bi-exclamation-triangle-fill"></i>
    {% endif %}
  </div>

  <h1 style="font-size: 2.4rem; color: var(--primary-navy); margin-bottom: 12px;">{{ code }}: {{ title }}</h1>
  <p style="font-size: 1.1rem; color: var(--text-muted); max-width: 500px; margin: 0 auto 32px; line-height: 1.6;">
    {{ message }}
  </p>

  <div style="display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;">
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">
      <i class="bi bi-house-door"></i> Return to Homepage
    </a>
    <a href="{{ url_for('listings.browse') }}" class="btn btn-outline">
      <i class="bi bi-grid-3x3-gap"></i> Browse Items
    </a>
    <a href="{{ url_for('main.contact') }}" class="btn btn-outline">
      <i class="bi bi-chat-text"></i> Contact Support
    </a>
  </div>
</div>
{% endblock %}
